<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitFut ⚽ — FIFA-style GitHub cards &amp; battles</title>
<meta name="description" content="Turn any GitHub profile into a FIFA Ultimate Team card, then battle two developers head-to-head.">
<link rel="canonical" href="https://github-fighter.vercel.app/">
<meta property="og:title" content="GitFut ⚽ — your GitHub as a FUT card"><meta property="og:type" content="website">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#07080c;--panel:#10121a;--line:#1e2230;--tx:#f4f5f8;--mut:#8a90a2;--acc:#f5c542;--red:#ff4d5e;--ice:#3dd9ff;--win:#2dff9a}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Inter,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
 background-image:radial-gradient(60% 40% at 50% -10%,#f5c54222,transparent),radial-gradient(40% 30% at 0 70%,#ff4d5e18,transparent),radial-gradient(40% 30% at 100% 70%,#3dd9ff18,transparent)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#07080ccc;backdrop-filter:blur(12px);z-index:5}
.brand{font-weight:900;letter-spacing:2px;text-transform:uppercase}.brand b{color:var(--acc)}
button{font:inherit;cursor:pointer;border:0}
.ghost{background:#ffffff08;border:1px solid var(--line);color:var(--mut);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ghost:hover{color:var(--acc);border-color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:clamp(30px,6vw,52px);line-height:1.05;text-align:center;font-weight:900}
h1 span{background:linear-gradient(90deg,var(--acc),var(--red));-webkit-background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mut);margin:12px 0 28px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.tab{padding:8px 18px;border-radius:999px;background:var(--panel);color:var(--mut);border:1px solid var(--line);font-weight:700}
.tab.on{background:var(--acc);color:#000;border-color:var(--acc)}
.form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:720px;margin:0 auto}
input{flex:1;min-width:150px;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--acc);border-color:transparent}
.go{padding:13px 26px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#ff9d2e);color:#000;font-weight:900;text-transform:uppercase;letter-spacing:1px}
.go:disabled{opacity:.5;cursor:wait}
.err{color:var(--red);text-align:center;margin-top:14px;min-height:20px}
.stage{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:30px}
/* FUT card */
.fc{width:260px;height:380px;position:relative;border-radius:22px 22px 60px 60px;padding:3px;color:var(--ink);animation:rise .6s both;
 clip-path:polygon(0 6%,10% 0,90% 0,100% 6%,100% 88%,50% 100%,0 88%)}
.fc.bronze{--ink:#3a1f0c;background:linear-gradient(150deg,#e8a46b,#9a5a2b 60%,#e8a46b)}
.fc.silver{--ink:#20242c;background:linear-gradient(150deg,#f4f6fa,#8f98a8 60%,#f4f6fa)}
.fc.gold{--ink:#3b2a00;background:linear-gradient(150deg,#ffe58a,#c99a1b 60%,#ffe58a)}
.fc.icon{--ink:#fff;background:linear-gradient(150deg,#7df3ff,#6a4dff 55%,#ff6bd5)}
.fc.winner{filter:drop-shadow(0 0 22px var(--win))}
.fc-in{height:100%;clip-path:inherit;padding:26px 22px 0;position:relative;background:linear-gradient(160deg,#ffffff30,#00000018),inherit}
.fc-ovr{position:absolute;left:30px;top:44px;font-size:44px;font-weight:900;line-height:1}
.fc-pos{position:absolute;left:30px;top:90px;font-weight:800;letter-spacing:1px}
.fc-flag{position:absolute;left:30px;top:116px;font-size:22px}
.fc-lang{position:absolute;left:30px;top:150px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:900;color:#000}
.fc-rar{position:absolute;right:34px;top:30px;font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;opacity:.75}
.fc-img{position:absolute;right:26px;top:48px;width:132px;height:132px;border-radius:50%;object-fit:cover;border:3px solid #ffffff66}
.fc-name{position:absolute;top:196px;left:0;right:0;text-align:center;font-weight:900;font-size:19px;text-transform:uppercase;padding:0 26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-login{position:absolute;top:220px;left:0;right:0;text-align:center;font-size:12px;opacity:.7}
.fc-st{position:absolute;top:248px;left:30px;right:30px;display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;border-top:1px solid #00000033;padding-top:8px}
.fc-st div{display:flex;gap:8px;align-items:baseline;font-weight:900;font-size:19px}.fc-st small{font-size:12px;opacity:.7;font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(30px) rotateY(25deg)}}
/* battle */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin:28px auto 0;max-width:720px}
.verdict{text-align:center;font-size:22px;font-weight:900;margin-bottom:14px}.verdict em{color:var(--win);font-style:normal}
.row{display:grid;grid-template-columns:1fr 70px 1fr;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.row .lab{text-align:center;color:var(--mut);font-weight:800;letter-spacing:1px}
.bar{height:10px;background:#ffffff0d;border-radius:99px;overflow:hidden;display:flex}
.bar.l{justify-content:flex-end}.bar i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1);background:var(--mut);border-radius:99px}
.bar i.w{background:var(--win)}
.num{display:flex;justify-content:space-between;font-weight:800;margin-bottom:3px}
.tops{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;font-size:13px}
.tops a{color:var(--ice);text-decoration:none;display:block}.tops p{color:var(--mut);font-size:12px}
.actions{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.hist{margin-top:34px;text-align:center;color:var(--mut);font-size:13px}.hist button{margin:4px;background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:5px 12px;border-radius:99px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--acc);color:#000;padding:9px 18px;border-radius:99px;font-weight:800;opacity:0;transition:.3s;pointer-events:none}.toast.on{opacity:1}
@media(max-width:600px){.row{grid-template-columns:1fr 54px 1fr}.tops{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="brand">Git<b>Fut</b> ⚽</div>
 <div><span id="who" class="ghost" style="display:none;margin-right:6px"></span><button class="ghost" id="auth" onclick="authClick()">Log in with GitHub</button></div></header>
<main>
 <h1>Your GitHub, as a <span>FUT card</span></h1>
 <p class="sub">Generate your card, or battle two developers head-to-head.</p>
 <div class="tabs"><button class="tab on" data-m="card">My Card</button><button class="tab" data-m="battle">Battle</button></div>
 <div class="form"><input id="u1" placeholder="GitHub username" autocomplete="off" spellcheck="false">
  <input id="u2" placeholder="Opponent username" autocomplete="off" spellcheck="false" style="display:none">
  <button class="go" id="go">Generate</button></div>
 <div class="err" id="err" role="alert"></div>
 <div id="out"></div><div class="hist" id="hist"></div>
</main><div class="toast" id="toast"></div>
<script>
const API = location.hostname==='localhost'||location.hostname==='127.0.0.1' ? 'http://localhost:3000' : 'https://github-battle-1.onrender.com';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='card', me=null;
const LC={JavaScript:'#f7df1e',TypeScript:'#3178c6',Python:'#3572A5',Java:'#b07219',Go:'#00add8',Rust:'#dea584',Ruby:'#701516',PHP:'#4f5d95','C++':'#f34b7d',C:'#888',Swift:'#fa7343',Kotlin:'#7f52ff',HTML:'#e34c26',CSS:'#563d7c',Shell:'#89e051',Dart:'#00b4ab','C#':'#178600'};
// ── FUT attribute engine ──
const ls=(v,cap,min=40,max=99)=>Math.round(min+Math.min(1,Math.log(Math.max(0,v||0)+1)/Math.log(cap+1))*(max-min));
const days=d=>Math.floor((Date.now()-new Date(d))/864e5);
function fut(d){
 const fresh=d.topRepos.length?Math.min(...d.topRepos.map(r=>days(r.updated))):730;
 const pac=ls(Math.max(0,730-Math.min(fresh,730))+d.recentRepos*30,1000,40,97);
 const s={pac,sho:ls(d.stars,50000,22,99),pas:ls(d.followers,20000,22,99),dri:ls(d.languages.length,10,30,95),def:ls(d.repos,300,22,99),phy:ls(d.accountAge*10+d.forks/20,220,22,99)};
 s.ovr=Math.round(s.pac*.12+s.sho*.22+s.pas*.16+s.dri*.16+s.def*.16+s.phy*.18);return s}
const rar=o=>o>=85?'icon':o>=75?'gold':o>=65?'silver':'bronze';
const POS={sho:'ST',pas:'CAM',dri:'LW',pac:'RB',def:'CB',phy:'CDM'};
const pos=s=>POS[Object.keys(POS).sort((a,b)=>s[b]-s[a])[0]];
const FL=[[/india|bangalore|mumbai|delhi|pune|nashik|nagpur|hyderabad|chennai|kolkata/i,'🇮🇳'],[/usa|united states|california|new york|seattle|austin|boston|texas|san francisco/i,'🇺🇸'],[/\buk\b|england|london|scotland|united kingdom/i,'🇬🇧'],[/germany|berlin|munich/i,'🇩🇪'],[/france|paris/i,'🇫🇷'],[/canada|toronto|vancouver/i,'🇨🇦'],[/australia|sydney|melbourne/i,'🇦🇺'],[/japan|tokyo/i,'🇯🇵'],[/china|beijing|shanghai/i,'🇨🇳'],[/brazil|são paulo|sao paulo/i,'🇧🇷'],[/netherlands|amsterdam/i,'🇳🇱'],[/spain|madrid|barcelona/i,'🇪🇸']];
const flag=l=>(FL.find(([r])=>r.test(l||''))||[])[1]||'';
function card(d,f,win){const r=rar(f.ovr),tl=d.languages[0]?.name;
 return `<div class="fc ${r}${win?' winner':''}" data-login="${esc(d.login)}"><div class="fc-in">
 <span class="fc-rar">${r}</span><img class="fc-img" crossorigin="anonymous" src="${esc(d.avatar)}&s=264" alt="${esc(d.login)}">
 <div class="fc-ovr">${f.ovr}</div><div class="fc-pos">${pos(f)}</div><div class="fc-flag">${flag(d.location)}</div>
 ${tl?`<div class="fc-lang" style="background:${LC[tl]||'#aaa'}" title="${esc(tl)}">${esc(tl[0])}</div>`:''}
 <div class="fc-name">${esc(d.name)}</div><div class="fc-login">@${esc(d.login)}</div>
 <div class="fc-st">${['pac','dri','sho','def','pas','phy'].map(k=>`<div>${f[k]}<small>${k.toUpperCase()}</small></div>`).join('')}</div></div></div>`}
// ── API ──
async function api(path,opt={}){const r=await fetch(API+path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
// ── Views ──
function showCard(d){const f=fut(d);$('out').innerHTML=`<div class="stage">${card(d,f)}</div>
 <div class="actions"><button class="ghost" onclick="dl('${esc(d.login)}')">⬇ Download PNG</button><button class="ghost" onclick="share()">🔗 Copy link</button>
 <button class="ghost" onclick="setMode('battle',true)">⚔ Challenge someone</button></div>`}
const STATS=[['ovr','OVERALL'],['pac','PAC'],['sho','SHO'],['pas','PAS'],['dri','DRI'],['def','DEF'],['phy','PHY']];
function showBattle({p1,p2,winner}){const f1=fut(p1),f2=fut(p2),w=winner==='p1'?p1:p2;
 const rows=STATS.map(([k,l])=>{const a=f1[k],b=f2[k],m=Math.max(a,b,1);
  return `<div class="row"><div><div class="num"><span>${a}</span></div><div class="bar l"><i class="${a>b?'w':''}" data-w="${a/m*100}"></i></div></div><div class="lab">${l}</div><div><div class="num"><span></span><span>${b}</span></div><div class="bar"><i class="${b>a?'w':''}" data-w="${b/m*100}"></i></div></div></div>`}).join('');
 const top=p=>`<div><b>${esc(p.name)}</b>${p.topRepos.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">★ ${r.stars} ${esc(r.name)}</a><p>${esc(r.desc).slice(0,70)}</p>`).join('')||'<p>No public repos</p>'}</div>`;
 const ties=STATS.slice(1).filter(([k])=>f1[k]===f2[k]).length, w1=STATS.slice(1).filter(([k])=>f1[k]>f2[k]).length, w2=STATS.length-1-ties-w1;
 $('out').innerHTML=`<div class="stage">${card(p1,f1,w===p1)}${card(p2,f2,w===p2)}</div>
 <div class="panel"><div class="verdict">🏆 <em>${esc(w.name)}</em> wins</div>
 <p style="text-align:center;color:var(--mut);font-size:13px;margin-bottom:10px">Power score ${p1.score} vs ${p2.score} · attributes ${w1}–${w2}${ties?` (${ties} tied)`:''}</p>${rows}
 <div class="tops">${top(p1)}${top(p2)}</div></div>
 <div class="actions"><button class="ghost" onclick="share()">🔗 Copy battle link</button><button class="ghost" onclick="dl()">⬇ Download cards</button></div>`;
 requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'),50));
 if(w===p1||w===p2)confetti()}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9';c.width=innerWidth;c.height=innerHeight;document.body.append(c);const x=c.getContext('2d'),P=[...Array(110)].map(()=>({x:Math.random()*c.width,y:-20,v:2+Math.random()*4,s:4+Math.random()*5,c:['#f5c542','#ff4d5e','#3dd9ff','#2dff9a'][Math.random()*4|0],r:Math.random()*6}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.y/30+p.r);x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s*1.6)});if(++t<150)requestAnimationFrame(f);else c.remove()})()}
async function dl(login){const els=login?[document.querySelector(`.fc[data-login="${login}"]`)]:[...document.querySelectorAll('.fc')];
 for(const el of els){const c=await html2canvas(el,{backgroundColor:null,useCORS:true,scale:2});const a=document.createElement('a');a.download=`gitfut-${el.dataset.login}.png`;a.href=c.toDataURL();a.click()}}
// ── Flow ──
function setMode(m,focus){mode=m;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===m));
 $('u2').style.display=m==='battle'?'':'none';$('go').textContent=m==='battle'?'Battle!':'Generate';if(focus)$('u2').focus()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.m));
const USER=/^[a-z\d](?:[a-z\d]|-(?=[a-z\d])){0,38}$/i;
async function run(u1,u2){$('err').textContent='';const b=mode==='battle';
 if(!USER.test(u1)||(b&&!USER.test(u2||''))){$('err').textContent='Enter valid GitHub username'+(b?'s':'');return}
 $('go').disabled=true;$('go').textContent='Scouting…';
 try{ if(b){showBattle(await api('/api/battle',{method:'POST',body:JSON.stringify({username1:u1,username2:u2})}));hist(u1,u2)}
  else{showCard(await api('/api/profile/'+u1));hist(u1)}
  history.replaceState(null,'',b?`?u1=${u1}&u2=${u2}`:`?u=${u1}`)}
 catch(e){$('err').textContent=e.message}
 finally{$('go').disabled=false;$('go').textContent=b?'Battle!':'Generate'}}
$('go').onclick=()=>run($('u1').value.trim(),$('u2').value.trim());
[$('u1'),$('u2')].forEach(i=>i.addEventListener('keydown',e=>e.key==='Enter'&&$('go').click()));
function share(){navigator.clipboard.writeText(location.href).then(()=>toast('Link copied!'),()=>toast(location.href))}
// ── History ──
const H='gitfut-history';const lh=()=>{try{return JSON.parse(localStorage.getItem(H)||'[]')}catch{return[]}};
function hist(a,b){try{const h=[[a,b].filter(Boolean),...lh().filter(x=>x.join()!==[a,b].filter(Boolean).join())].slice(0,8);localStorage.setItem(H,JSON.stringify(h))}catch{}drawHist()}
function drawHist(){const h=lh();$('hist').innerHTML=h.length?'Recent: '+h.map(x=>`<button onclick="replay('${esc(x[0])}','${esc(x[1]||'')}')">${x.map(esc).join(' ⚔ ')}</button>`).join(''):''}
function replay(a,b){$('u1').value=a;$('u2').value=b;setMode(b?'battle':'card');run(a,b)}
// ── Auth ──
async function initAuth(){try{const r=await api('/auth/me');me=r.user;
 $('auth').textContent=me?'Log out':'Log in with GitHub';$('who').style.display=me?'':'none';if(me){$('who').textContent='@'+me.login;if(!$('u1').value)$('u1').value=me.login}}catch{}}
async function authClick(){if(me){await api('/auth/logout',{method:'POST'}).catch(()=>{});me=null;initAuth()}else location.href=API+'/auth/github'}
// ── Boot ──
const q=new URLSearchParams(location.search);drawHist();initAuth();
if(q.get('u1')&&q.get('u2')){$('u1').value=q.get('u1');$('u2').value=q.get('u2');setMode('battle');run(q.get('u1'),q.get('u2'))}
else if(q.get('u')){$('u1').value=q.get('u');run(q.get('u'),'')}
</script></body></html>
